[project]
name = "coord-server"
version = "0.13.3"
description = "coord server and certificate management: claims, messages, tasks for concurrent agent sessions (clients: clients/ts)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]

[project.scripts]
coord-server = "coordination.server:main"
coord-admin = "coordination.pki:main"
coord-local = "coordination.local:main"
coord-db = "coordination.maintenance:main"

[project.optional-dependencies]
gitlab = [
    "python-gitlab>=8.5.0",
]

[dependency-groups]
dev = ["ruff>=0.8", "pyright>=1.1.390"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # long lines: this codebase wraps by hand, not at a fixed column
    "E702",    # `a; b` on one line: a deliberate, pervasive style here, not an accident
    "SIM112",  # os.environ.get("ProgramFiles(x86)") etc: the real Windows env var names, not ALL_CAPS
]

[tool.pyright]
include = ["coordination", "tools"]
pythonVersion = "3.11"
pythonPlatform = "All"   # this code runs on Linux, Windows and macOS (T24): check every platform's stdlib
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = ["coordination"]

[tool.setuptools.package-data]
coordination = ["ui/*"]

[tool.uv]
# Use the OS trust store: behind a TLS-intercepting corporate proxy, uv's
# bundled roots reject PyPI and building this project (setuptools) fails.
system-certs = true
